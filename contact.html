<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - CAM BAKER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
        }

        .nav-left {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: white;
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            gap: 40px;
        }

        .nav-right a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        .nav-right a:hover {
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background: #1a1a1a;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            background: #2a2a2a;
            border: 1px solid #404040;
            border-radius: 5px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #fff;
            background: #333;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #2a2a2a;
            color: white;
        }

        button {
            width: 100%;
            padding: 15px;
            background: white;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .required {
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .nav {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            .nav-right {
                gap: 20px;
            }

            .container {
                margin: 100px 20px 20px;
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <a href="index.html" class="nav-left">CAM BAKER</a>
        <div class="nav-right">
            <a href="index.html#portfolio">PORTFOLIO</a>
            <a href="contact.html">CONTACT</a>
        </div>
    </nav>

    <!-- Contact Form -->
    <div class="container">
        <h1>Let's Work Together</h1>
        <p class="subtitle">Tell me about your project and I'll get back to you with a quote</p>

        <form action="https://formspree.io/f/xovzvokd" method="POST">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="Your name">
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" required placeholder="(123) 456-7890">
            </div>

            <div class="form-group">
                <label for="workType">Type of Work <span class="required">*</span></label>
                <select id="workType" name="workType" required>
                    <option value="">-- Select Project Type --</option>
                    <option value="Commercial">Commercial</option>
                    <option value="Music Video">Music Video</option>
                    <option value="Corporate Video">Corporate Video</option>
                    <option value="Wedding">Wedding</option>
                    <option value="Event Coverage">Event Coverage</option>
                    <option value="Real Estate">Real Estate</option>
                    <option value="Documentary">Documentary</option>
                    <option value="Product Demo">Product Demo</option>
                    <option value="Social Media Content">Social Media Content</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Project Details</label>
                <textarea id="message" name="message" placeholder="Tell me about your project..."></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
