<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAM BAKER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .video-hero-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 1;
        }

        .video-hero-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 160vh;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .video-hero-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-align: center;
            color: white;
            font-size: 5vw;
            font-weight: 700;
            letter-spacing: 0.1em;
            pointer-events: none;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        /* Content below video hero */
        .content {
            position: relative;
            z-index: 10;
            margin-top: 100vh;
            background: #000;
            padding: 80px 40px;
            color: white;
            text-align: center;
            min-height: 60vh;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: white;
        }

        .nav-right {
            display: flex;
            gap: 40px;
        }

        .nav-right a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        .nav-right a:hover {
            color: white;
        }

        @media (max-width: 768px) {
            .video-hero-text {
                font-size: 8vw;
            }

            .nav {
                flex-direction: column;
                gap: 20px;
            }

            .nav-right {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-left">CAM BAKER</div>
        <div class="nav-right">
            <a href="#commercial">COMMERCIAL</a>
            <a href="#contact">CONTACT</a>
        </div>
    </nav>

    <!-- Video Hero Section -->
    <div class="video-hero-container">
        <iframe
            src="https://player.vimeo.com/video/1212969201?badge=0&autopause=0&player_id=0&app_id=58479&loop=1&background=1"
            frameborder="0"
            allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            title="Hero Video">
        </iframe>
        <div class="video-overlay"></div>
        <h1 class="video-hero-text">CAM BAKER</h1>
    </div>

    <!-- Content Below Hero -->
    <div class="content" id="commercial">
        <h2>Commercial Work</h2>
        <p>Your portfolio content here...</p>
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
