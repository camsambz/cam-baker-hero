<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAM BAKER - Videography</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .video-hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .video-hero-container video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 177.78vh;
            transform: translate(-50%, -50%);
            object-fit: cover;
            min-width: 100%;
            min-height: 100%;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .video-hero-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-align: center;
            color: white;
            font-size: 5vw;
            font-weight: 700;
            letter-spacing: 0.1em;
            pointer-events: none;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .nav-left {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: white;
        }

        .nav-right {
            display: flex;
            gap: 40px;
        }

        .nav-right a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.05em;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-right a:hover {
            color: white;
        }

        .content {
            position: relative;
            z-index: 10;
            margin-top: 100vh;
            background: #000;
            padding: 80px 40px;
            color: white;
            text-align: center;
            min-height: 60vh;
        }

        .content h2 {
            font-size: 36px;
            margin-bottom: 30px;
            letter-spacing: 0.05em;
        }

        .content p {
            font-size: 18px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto 40px;
            color: rgba(255,255,255,0.8);
        }

        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid white;
        }

        .cta-button:hover {
            background: transparent;
            color: white;
        }

        @media (max-width: 768px) {
            .video-hero-text {
                font-size: 8vw;
            }

            .nav {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .nav-right {
                gap: 20px;
            }

            .content {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-left">CAM BAKER</div>
        <div class="nav-right">
            <a href="#portfolio">PORTFOLIO</a>
            <a href="contact.html">CONTACT</a>
        </div>
    </nav>

    <!-- Video Hero Section -->
    <div class="video-hero-container">
        <video autoplay muted loop playsinline>
            <source src="MONTAGE_compressed.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"></div>
        <h1 class="video-hero-text">CAM BAKER</h1>
    </div>

    <!-- Content Below Hero -->
    <div class="content" id="portfolio">
        <h2>Professional Videography</h2>
        <p>Bringing your vision to life with cinematic storytelling and expert production. From commercials to narratives, I deliver high-quality video content tailored to your needs.</p>
        <a href="contact.html" class="cta-button">Get Your Quote</a>
    </div>
</body>
</html>
